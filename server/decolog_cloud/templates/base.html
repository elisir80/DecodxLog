<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DecoLog Cloud{% endblock %}</title>
  <link rel="stylesheet" href="/static/decolog.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <span class="name">DecoLog <b>Cloud</b></span>
    </div>
    {% if callsign is defined and callsign %}
    <nav class="who">
      {% set here = request.url.path %}
      <a class="button {% if here == '/log' %}on{% endif %}" href="/log">Log</a>
      <a class="button {% if here == '/stats' %}on{% endif %}" href="/stats">Statistiche</a>
      <a class="button {% if here == '/awards' %}on{% endif %}" href="/awards">Diplomi</a>
      <a class="button {% if here == '/qsl' %}on{% endif %}" href="/qsl">QSL</a>
      <a class="button {% if here == '/map' %}on{% endif %}" href="/map">Mappa</a>
      <a class="button {% if here == '/station' %}on{% endif %}" href="/station">Stazione</a>
      <span class="call">{{ callsign }}</span>
      <a class="button" href="/export.adi">Scarica ADIF</a>
      <form method="post" action="/logout" class="inline">
        <button class="button" type="submit">Esci</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    Il log vero resta sul tuo computer: qui c'è la copia che i tuoi dispositivi
    si passano.
  </footer>
</body>
</html>
