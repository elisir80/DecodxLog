<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DecoDXLog Cloud — accesso</title>
  <link rel="stylesheet" href="/static/decolog.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand block">
      <span class="name">DECOLOG</span>
      <span class="ver">cloud</span>
    </div>
  </header>

  <div class="panel login">
    <header>
      <span class="grip">⠿</span><span class="dot"></span>
      <h2>Il tuo log</h2>
    </header>
    <div class="body">
      <p class="muted">
        Gli stessi nominativo e password che usi in DecoDXLog. Da qui il log si guarda
        e si scarica: si scrive dal programma.
      </p>

      {% if error %}<p class="err">{{ error }}</p>{% endif %}

      <form method="post" action="/login" class="stack">
        <label>
          <span>Nominativo</span>
          {# Nessuna lunghezza minima: i nominativi del mondo non stanno in una
             regola sola — 9H1SR, VY2XT, 9H1SR/M, un indicativo speciale corto. #}
          <input name="callsign" autocomplete="username" autocapitalize="characters"
                 autofocus required spellcheck="false">
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>
        <button type="submit">Entra</button>
      </form>
    </div>
  </div>

  <p class="foot">Il log vero resta sul tuo computer: qui c'è la copia che i tuoi dispositivi si passano.</p>
</div>
</body>
</html>
