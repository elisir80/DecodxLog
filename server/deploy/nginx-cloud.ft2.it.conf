# DecoLog Cloud dietro il nginx che c'e' gia' sul VPS.
#
# Si mette in /etc/nginx/sites-available/cloud.ft2.it e si collega in
# sites-enabled. Il certificato lo aggiunge certbot, che riscrive lui questo
# file aggiungendo le righe ssl_*: prima si parte in HTTP e poi si lancia
#
#   certbot --nginx -d cloud.ft2.it
#
# Nessun altro sito viene toccato: questo file parla solo di cloud.ft2.it.

server {
    listen 80;
    listen [::]:80;
    server_name cloud.ft2.it;

    # Il token viaggia nell'intestazione: su Internet ci vuole HTTPS, e dopo
    # certbot questa parte serve solo a mandare tutti sul sicuro.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.ft2.it;

    # ssl_certificate e ssl_certificate_key le mette certbot.

    access_log /var/log/nginx/decolog-cloud.access.log;
    error_log  /var/log/nginx/decolog-cloud.error.log;

    # Un push puo' portare qualche migliaio di QSO: il limite sta largo ma non
    # e' infinito.
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # La documentazione dell'API la vede solo chi entra da casa, non il mondo.
    location /docs {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
}
