# ATTENZIONE — questo flusso non parte piu' da solo.
#
# Il pacchetto che costruiva qui (MSVC + Qt ufficiale) si avvia e muore subito
# con 0xC0000409, stack buffer overrun: provato tre volte di fila sulla 1.7.2,
# sempre uguale. Lo stesso identico codice compilato con MSYS2/MinGW parte e
# funziona, quindi non e' il programma: e' come viene messo insieme il pacchetto.
#
# E faceva danno da solo: l'aggiornamento automatico cerca un file che finisce
# per "-setup.exe", e questo si chiamava cosi'. Chi diceva di si' si ritrovava
# un DecoDXLog che non partiva piu'.
#
# Il pacchetto per Windows lo si prepara a mano, come si e' sempre fatto fino
# alla 1.7.0, e come si e' tornati a fare dalla 1.7.2:
#     MINGW=/c/msys64/mingw64 BUILD=.../build-rel bash scripts/installer.sh
#     MINGW=/c/msys64/mingw64 BUILD=.../build-rel bash scripts/deploy.sh
#
# Resta qui perche' il lavoro e' buono e un giorno si capira' cosa lo rompe: si
# lancia a mano, e quello che ne esce si prova prima di pubblicarlo.
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.12.0

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtmultimedia qtpositioning qtlocation qtserialport qtwebsockets"
          cache: true

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install tools
        shell: pwsh
        run: choco install ninja innosetup --no-progress -y

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel 3 --target decolog

      - name: Deploy portable folder
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\DecoDXLog.exe dist\
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --qmldir qml `
            --qmldir libs\decodium-ui\qml `
            --release `
            --force-openssl `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            dist\DecoDXLog.exe
          $opensslDlls = @("libcrypto-3-x64.dll", "libssl-3-x64.dll")
          foreach ($dll in $opensslDlls) {
            if (-not (Test-Path "dist\$dll")) {
              $candidate = Join-Path "$env:QT_ROOT_DIR\bin" $dll
              if (Test-Path $candidate) {
                Copy-Item $candidate dist\
              }
            }
          }
          foreach ($dll in $opensslDlls) {
            if (-not (Test-Path "dist\$dll")) {
              throw "Missing required OpenSSL runtime DLL: $dll"
            }
          }
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item resources\cty\COPYRIGHT.txt dist\cty.csv-COPYRIGHT.txt
          Copy-Item libs\ggmorse\LICENSE dist\ggmorse-LICENSE.txt
          Copy-Item resources\decodxlog.ico dist\decodxlog.ico
          @"
          DecoDXLog $version

          Avvio: doppio clic su DecoDXLog.exe.
          Il log e le impostazioni stanno in %APPDATA%\Decodium.
          "@ | Set-Content -Encoding UTF8 dist\LEGGIMI.txt

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DVersion=$version" "/DSource=$PWD\dist" "/DOut=$PWD" "$PWD\packaging\decodxlog.iss"

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path dist -DestinationPath "release-assets\DecoDXLog-$version-windows-x64-portable.zip" -Force
          Copy-Item "DecoDXLog-$version-setup.exe" "release-assets\DecoDXLog-$version-windows-x64-setup.exe"

      - name: Ensure release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view "$env:TAG_NAME" *> $null; if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG_NAME" --title "DecoDXLog $env:TAG_NAME" --notes "DecoDXLog $env:TAG_NAME" }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$env:TAG_NAME" release-assets\* --clobber
