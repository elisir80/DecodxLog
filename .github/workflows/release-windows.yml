# Windows si costruisce soltanto a richiesta e con la stessa catena MSYS2/MinGW
# con cui viene provato il pacchetto reale. La vecchia catena MSVC produceva un
# eseguibile che usciva subito con 0xC0000409; non va rimessa qui finche' non e'
# stata capita e verificata su una macchina Windows vera.
#
# Prima si scarica l'artefatto, si prova DecoDXLog.exe, e solo in una seconda
# esecuzione manuale con publish=true si allegano gli asset alla release. Il
# setup pubblicato non finisce in "-setup.exe": l'auto-update non puo' quindi
# proporre per errore questo pacchetto sperimentale agli utenti Windows.
name: Release Windows (manual MinGW)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag sorgente e release destinataria
        required: true
        default: v1.16.43
        type: string
      publish:
        description: Ho provato l'artefatto Windows e autorizzo la pubblicazione
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (MSYS2 MinGW)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install MSYS2 MinGW and Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-positioning
            mingw-w64-x86_64-qt6-location
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qtkeychain
            mingw-w64-x86_64-openssl

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Configure
        run: cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-rel --parallel 3 --target decolog

      - name: Package with the tested MinGW procedure
        run: MINGW=/mingw64 BUILD="$PWD/build-rel" bash scripts/installer.sh

      - name: Prepare assets for review
        id: assets
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets
          cp "DecoDXLog-$version-setup.exe" "release-assets/DecoDXLog-$version-windows-x64-manual.exe"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload artefacts to test before publication
        uses: actions/upload-artifact@v4
        with:
          name: DecoDXLog-${{ steps.assets.outputs.version }}-windows-x64-MinGW-test
          path: release-assets/
          if-no-files-found: error

      - name: Upload reviewed release assets
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh release view "$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG_NAME" --title "DecoDXLog $env:TAG_NAME" --generate-notes
          }
          gh release upload "$env:TAG_NAME" release-assets\* --clobber
