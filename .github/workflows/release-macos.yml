# ATTENZIONE — questo flusso non parte piu' da solo.
#
# Il suo gemello per Windows produceva un pacchetto che va in crash all'avvio
# (0xC0000409), e nessuno qui puo' provare un .dmg. Si lancia a mano, e chi lo
# lancia lo prova.
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.7.2
      arch:
        description: Architettura da costruire (all, arm64, x86_64)
        required: true
        default: all
        type: choice
        options: [all, arm64, x86_64]

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch == 'arm64' && 'apple-silicon' || 'intel' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-14' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["arm64", "x86_64"]' || format('["{0}"]', inputs.arch)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install dependencies
        run: brew install cmake ninja qt qtkeychain openssl@3 brotli webp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qtkeychain)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel 3 --target decolog

      - name: Deploy app bundle
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          # Le formule Homebrew tengono WebP, Sharpyuv e Brotli fuori dal
          # prefisso Qt: dichiararle esplicitamente evita rpath irrisolti sul
          # runner Intel. La firma la facciamo dopo il deploy, su ogni binario.
          macdeployqt build/DecoDXLog.app \
            -qmldir=qml \
            -qmldir=libs/decodium-ui/qml \
            -libpath="$(brew --prefix brotli)/lib" \
            -libpath="$(brew --prefix webp)/lib" \
            -no-codesign \
            -verbose=1

          # DecoDXLog non importa QtQuick.VirtualKeyboard. macdeployqt puo'
          # comunque copiare il plugin di input come symlink: codesign non puo'
          # firmare quel link e l'intero bundle Intel viene rifiutato. Non
          # serve all'app, quindi lo escludiamo esplicitamente dal pacchetto.
          rm -rf build/DecoDXLog.app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib
          rm -rf build/DecoDXLog.app/Contents/Resources/qml/QtQuick/VirtualKeyboard

          # Alcuni provider (ad esempio geoservices) sono directory symlink
          # verso la cantina Homebrew. find non attraversa tali directory e
          # quindi i loro plugin non arrivano mai a codesign. Materializziamo
          # interamente soltanto PlugIns e i moduli QML: i symlink interni ai
          # framework Qt restano invece intatti.
          for tree in PlugIns Resources/qml; do
            source="build/DecoDXLog.app/Contents/$tree"
            [ -d "$source" ] || continue
            materialized="$source.materialized"
            cp -R -L "$source" "$materialized"
            rm -rf "$source"
            mv "$materialized" "$source"
          done
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets

          # Si firmano gli oggetti reali (non i symlink). In particolare
          # QtVirtualKeyboard puo' essere trascinato da macdeployqt sul runner
          # Intel anche se l'app non lo importa: senza questa firma esplicita
          # codesign --deep lascia il plugin non firmato e rifiuta l'intero app.
          while IFS= read -r -d '' item; do
            codesign --force --sign - --timestamp=none "$item"
          done < <(find build/DecoDXLog.app/Contents -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0)

          codesign --force --deep --sign - --timestamp=none build/DecoDXLog.app
          codesign --verify --deep --strict --verbose=2 build/DecoDXLog.app

          hdiutil create -volname "DecoDXLog $version" \
            -srcfolder build/DecoDXLog.app \
            -ov -format UDZO \
            "release-assets/DecoDXLog-$version-macos-${{ matrix.arch }}.dmg"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "DecoDXLog $TAG_NAME" --notes "DecoDXLog $TAG_NAME"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
